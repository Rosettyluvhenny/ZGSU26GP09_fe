specVersion: "4.0"
metadata:
  name: com.zgp9.fe
type: application
framework:
  name: SAPUI5
  version: "1.108.33"
  libraries:
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    # Compile TypeScript before the UI5 standalone bundle is generated.
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    # Upload the completed build to the ABAP UI5 repository.
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        verbose: true
        # The school system currently uses a certificate that is not trusted locally.
        # Set this to false once its CA certificate is installed on the development PC.
        ignoreCertErrors: true
        target:
          url: "https://s40lp1.ucc.cit.tum.de"
          client: "324"
          auth: basic
        app:
          name: "ZGSU26GP09_FE_1"
          description: "Do an tot nghiep UI5"
          # Team project package (created by DEV-257, transport layer SAP, software
          # component HOME). Transportable — "Record Object Changes in Transport
          # Requests" is on — which $TMP was not.
          package: "ZGSU26GP09"
          # The request, not its task (S40K919518). Must be modifiable at deploy time —
          # releasing it before the upload leaves the objects nowhere to go.
          transport: "S40K919517"
        exclude:
          - "/test/"
          # The ABAP UI5 repository rejects TypeScript source files.
          # JavaScript files generated by ui5-tooling-transpile are retained.
          - "\\.ts$"
          # `npm run deploy` builds with ui5.yaml, whose ui5-task-zipper emits
          # dist/com.zgp9.fe.zip for the BTP html5-apps-repo. Without this the ABAP
          # upload ships the app a second time, zipped, inside itself.
          - "\\.zip$"
