specVersion: "4.0"
metadata:
  name: com.zgp9.fe
type: application
framework:
  name: SAPUI5
  version: "1.149.1"
  libraries:
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.m
    - name: sap.ui.core
    - name: sap.suite.ui.microchart
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: "com.zgp9.fe"
        additionalContent:
          - xs-app.json
server:
  customMiddleware:
    - name: ui5-middleware-sap-proxy
      afterMiddleware: compression
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression


