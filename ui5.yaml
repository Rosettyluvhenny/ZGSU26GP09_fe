specVersion: "4.0"
metadata:
  name: com.zgp9.fe
type: application
framework:
  name: SAPUI5
  version: "1.108.33"
  libraries:
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.layout
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
      # Dev-only bootstrap: loads UI5 from the tooling-served /resources so local dev
      # runs the same 1.108.33 the launchpad does. Would 404 if deployed.
      - "index-local.html"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: "com.zgp9.fe"
        additionalContent:
          - xs-app.json
server:
  customMiddleware:
    - name: ui5-middleware-sap-proxy
      afterMiddleware: compression
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression


