<!doctype html>
<html>
	<head>
		<meta http-equiv="Cache-control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="expires" content="0" />

		<meta charset="utf-8" />

		<title>FLP Sandbox: com.zgp9.fe (UI5 1.108.33)</title>

		<!--
			⚠️ KNOWN BROKEN — DOES NOT BOOT. Read this before spending time on it.

			The page loads, the title appears, and then nothing: blank body, spinner forever,
			and a COMPLETELY EMPTY CONSOLE. No error, no failed request, no rejected promise.

			Diagnosis (confirmed, not a guess): sandbox.js does not merely create a container,
			it hijacks UI5's boot sequence —

			    window["sap-ui-config"] = { "xx-bootTask": function (fnCallback) {
			        init().then(function (bootstrap) { bootstrap(fnCallback); });
			    } };

			Core initialisation BLOCKS on that boot task. `init()` does an async
			sap.ui.require([... "sap/ushell/Container"]). If that require never settles, its
			callback never runs, `fnCallback` is never invoked, and Core waits forever. UI5's
			loader does not reject or log in this path, which is why the console stays clean.
			Same silent-failure shape as FLP_MIGRATION.md 4.6 trap 1.

			Ruled out with evidence, so do not re-check these:
			  - Not missing resources. flpSandbox.html, sandbox.js, sap/ushell/Container.js,
			    renderers/fiori2/Renderer.js, adapters/local/ContainerAdapter.js and
			    Component.js all return HTTP 200 from the dev server.
			  - Not ui5-middleware-sap-proxy. It intercepts only /sap/opu/odata4/…, the two
			    /ai/* routes and /logout; everything else calls next().
			  - Not the app's own code. Nothing in com.zgp9.fe has run at this point — Core has
			    not finished booting, so no Component is ever created.

			Still unknown: WHICH module in the Container chain fails to settle, and why. That
			is where anyone resuming this should start — instrument the require, or diff
			against a known-good flpSandbox.html generated by Fiori tools for 1.108.

			Superseded by the Phase 3 verification plan: the project fell back to option (b),
			verifying the embedding inside the real launchpad at Phase 7.1 instead. Kept in the
			tree because the infrastructure around it is sound and reusable — the framework
			resolves, sap.ushell 1.108.33 installs and every resource serves. Only the boot
			handshake is unsolved.

			Local Fiori Launchpad sandbox. Runs the app inside a real sap.ushell shell, on the
			same UI5 1.108.33 the launchpad on s40lp1 serves.

			Why this file exists: Phase 3's embedding bugs (hidden header, stylesheet path,
			FLP hash parsing) are invisible in index-local.html because sap.ushell.Container
			does not exist there. Without this page every one of them costs an ABAP deploy
			cycle to find. See FLP_MIGRATION.md Phase 3.

			Run with:  npm run start:flp
			Served by ui5-flp.yaml, which declares sap.ushell. ui5.yaml deliberately does not —
			on the real launchpad the shell supplies sap.ushell, never the app.

			Not deployed: excluded from the build in ui5.yaml and ui5-flp.yaml.

			This is a sandbox, not the launchpad. It gives a genuine sap.ushell.Container, an
			intent-shaped hash and the shell bar, which is what Phase 3 needs. It does NOT
			reproduce s40lp1's catalog, target mapping, roles or theme defaults — those are
			Phase 6, and Phase 7.1 still has to run inside the real FLP.
		-->
		<script>
			window["sap-ushell-config"] = {
				defaultRenderer: "fiori2",
				renderers: {
					fiori2: {
						componentData: {
							config: {
								enableSearch: false
							}
						}
					}
				},
				applications: {
					// Key is "<semanticObject>-<action>", and must stay in step with
					// sap.app.crossNavigation.inbounds in manifest.json and with the target
					// mapping created in Phase 6.3. Changing the semantic object means
					// changing it in all three places.
					"ZODataServiceRegistry-manage": {
						title: "Registry Control Center",
						description: "Model registry control centre",
						applicationType: "URL",
						additionalInformation: "SAPUI5.Component=com.zgp9.fe",
						// Relative to this file (webapp/test/) — resolves to the webapp root,
						// which is where Component.js and manifest.json live.
						url: "../"
					}
				}
			};
		</script>

		<!--
			Bootstrap order matters: the sandbox has to install its ushell container config
			before sap-ui-core.js initialises, or Container is missing when the renderer runs.
		-->
		<script src="../test-resources/sap/ushell/bootstrap/sandbox.js"></script>

		<!--
			Legacy single-token attribute names (resourceroots / compatversion / frameoptions),
			NOT the kebab-case forms used by index.html. 1.108 silently ignores kebab-case:
			the attributes parse to unknown keys and you get a blank page with a clean console.
			See FLP_MIGRATION.md 4.6 trap 1 — index-local.html carries the same warning.

			No data-sap-ui-oninit here: unlike index-local.html this page must NOT use
			ComponentSupport. The ushell renderer creates the component, via the intent above.
		-->
		<script
			id="sap-ui-bootstrap"
			src="../resources/sap-ui-core.js"
			data-sap-ui-libs="sap.m,sap.ushell"
			data-sap-ui-resourceroots='{
				"com.zgp9.fe": "../"
			}'
			data-sap-ui-compatversion="edge"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-frameoptions="allow"
			data-sap-ui-async="true"
		></script>

		<script>
			sap.ui.getCore().attachInit(function () {
				// createRenderer(), not createRendererInternal() — the latter arrived well
				// after 1.108.
				sap.ushell.Container.createRenderer().placeAt("content");
			});
		</script>
	</head>

	<body class="sapUiBody" id="content"></body>
</html>
